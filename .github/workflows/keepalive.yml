name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * *'   # Runs daily
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Check if today is a keep-alive day
        run: |
          DAY=$(date +%j)
          if [ $((DAY % 5)) -ne 0 ]; then
            echo "Not a keep-alive day."
            exit 0
          fi

      - name: Insert keep-alive record
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/sensor_logs" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{
              "sensor_id":"26da909b-bc65-4095-a1c7-dabfe1553724",
              "event":"GitHub Keep Alive",
              "detail":"Automatic keep-alive from GitHub Actions"
            }'
