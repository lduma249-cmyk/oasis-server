.mn{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tb{padding:14px 22px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}

.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:18px}

.fl{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:5px}

// AUTH

// API
async function api(table,opts={}){
  const{method='GET',filter='',body,select='*',order='',limit=''}=opts;
  let url=`${SUPA}/rest/v1/${table}?select=${select}`;
  if(filter)url+='&'+filter;
  if(order)url+='&order='+order;
  if(limit)url+='&limit='+limit;
  const h={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':'return=minimal'};
  const r=await fetch(url,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok){console.error(await r.text());return null;}
  const t=await r.text();return t?JSON.parse(t):(method==='GET'?[]:true);
}
const get=(t,f,x={})=>api(t,{filter:f,...x});
const post=(t,b)=>api(t,{method:'POST',body:b});
const patch=(t,f,b)=>api(t,{method:'PATCH',filter:f,body:b});

// BACKUP (server-side, writes to disk — separate from Supabase)
function relTime(d){
  const s=Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
async function loadBackupStatus(){
  const el=document.getElementById('bkst');
  try{
    const r=await fetch('/api/backups');
    const list=await r.json();
    if(!list.length){el.textContent='Backup: none yet';return;}
    el.textContent='Last backup: '+relTime(list[0].createdAt);
    el.title=list[0].file;
  }catch(e){el.textContent='Backup: status unknown';}
}
async function backupNow(){
  const btn=document.getElementById('bkbtn');
  const el=document.getElementById('bkst');
  btn.disabled=true;btn.textContent='⏳ Backing up…';
  try{
    const r=await fetch('/api/backup',{method:'POST'});
    const d=await r.json();
    if(d.status==='ok'){
      const total=Object.values(d.rowCounts).filter(v=>v!=='ERROR').reduce((a,b)=>a+b,0);
      toast('Backup complete — '+total+' rows saved','ok');
      if(d.errors&&d.errors.length)toast(d.errors.length+' table(s) failed — check server log','err');
      await alog('Backup Created','Manual backup, '+total+' rows across '+Object.keys(d.rowCounts).length+' tables');
    }else{
      toast('Backup failed: '+d.error,'err');
    }
  }catch(e){
    toast('Could not reach backup endpoint — is the server running?','err');
  }finally{
    btn.disabled=false;btn.textContent='🗄 Backup Now';
    loadBackupStatus();rBkp();
  }
}

// ── BACKUPS PAGE (full list, restore, schema download) ─────────
let bkpFiles=[];
async function rBkp(){
  const el=document.getElementById('p-bkp');
  if(!el)return;
  try{
    const r=await fetch('/api/backups');
    bkpFiles=await r.json();
  }catch(e){bkpFiles=[];}

  const intro=`<div style="font-size:13px;color:rgba(255,255,255,.55);line-height:1.6;margin-bottom:4px">
    A backup saves every table's data to a file on this computer's hard drive — runs automatically every day at 10:00 while the server is on, or any time via <strong>Backup Now</strong>.<br><br>
    <strong>If tables were ever deleted/dropped:</strong> first run the schema script below in the Supabase SQL Editor to recreate the table structures, <em>then</em> restore a backup to refill the data with original IDs intact (so relationships stay correct).
  </div>`;

  const schemaAct=`<button class="btn bsm bgh" onclick="window.open('/api/backup-sql','_blank')">⬇ Download Schema SQL</button>`;
  const schemaPanel=pnl('1. Rebuild table structure (only if tables were dropped)',
    `<div style="font-size:13px;color:rgba(255,255,255,.5)">Downloads a .sql file with CREATE TABLE for all 13 tables, in the correct order. Open it, copy the contents, and run it in Supabase → SQL Editor.</div>`,
    schemaAct);

  const backupAct=`<button class="btn bsm" id="bkbtn2" onclick="backupNow()">🗄 Backup Now</button>`;
  const rows=bkpFiles.map(f=>[
    f.file,
    fdt(f.createdAt)+' '+ftm(f.createdAt),
    (f.size/1024).toFixed(1)+' KB',
    `<button class="btn bsm" onclick="restoreFile('${f.file}')">♻ Restore</button>`
  ]);
  const listPanel=pnl('2. Restore data from a backup',
    intro2()+tbl(['File','Created','Size',''],rows,'No backups yet — click Backup Now to create one.'),
    backupAct);

  el.innerHTML=intro+schemaPanel+listPanel;
}
function intro2(){return `<div style="font-size:11px;color:rgba(255,255,255,.35);margin-bottom:10px">Restoring re-inserts each row with its original ID. Existing rows with the same ID are left untouched (not duplicated).</div>`;}

async function restoreFile(file){
  if(!confirm('Restore data from "'+file+'"?\n\nThis writes rows back into your live tables (existing rows with the same ID are skipped, not duplicated). Make sure the table structures already exist.'))return;
  toast('Restoring…','info');
  try{
    const r=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file})});
    const d=await r.json();
    if(d.status==='ok'){
      const total=Object.values(d.inserted).reduce((a,b)=>a+b,0);
      toast('Restore complete — '+total+' rows inserted','ok');
      if(d.errors&&d.errors.length)toast(d.errors.length+' table(s) had errors — check server log','err');
      await alog('Data Restored','From '+file+' — '+total+' rows');
      init();
    }else{
      toast('Restore failed: '+d.error,'err');
    }
  }catch(e){
    toast('Could not reach restore endpoint','err');
  }
}

// FORMAT
const rnd=n=>'R '+parseFloat(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fdt=s=>s?new Date(s).toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}):'—';
const ftm=s=>s?new Date(s).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}):'—';

function bdg(t,c){
  const m={Ready:'#10b981',Processing:'#f59e0b',Received:'#38bdf8',Collected:'#a78bfa',Overdue:'#ef4444',Pending:'#f59e0b',Confirmed:'#10b981',Active:'#10b981',Running:'#10b981',Idle:'#64748b',Error:'#ef4444',Owner:'#38bdf8',Counter:'#f59e0b',Cleaning:'#a78bfa',Cash:'#10b981',Card:'#38bdf8',EFT:'#f59e0b'};
  const col=c||m[t]||'#64748b';
  return `<span style="padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:${col}22;color:${col};border:1px solid ${col}44">${t}</span>`;
}

function toast(msg,type='ok'){
  let w=document.getElementById('tw');
  if(!w){w=document.createElement('div');w.id='tw';w.style.cssText='position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:7px';document.body.appendChild(w);}
  const d=document.createElement('div');
  const c={ok:'rgba(16,185,129,.15)',err:'rgba(239,68,68,.15)',info:'rgba(14,165,233,.15)'};
  const b={ok:'rgba(16,185,129,.3)',err:'rgba(239,68,68,.3)',info:'rgba(14,165,233,.3)'};
  d.style.cssText=`padding:11px 15px;background:${c[type]};border:1px solid ${b[type]};border-radius:9px;font-size:13px;font-weight:600;color:#f0f6fc;font-family:'Manrope',sans-serif;min-width:200px`;
  d.textContent=({ok:'✓',err:'✗',info:'ℹ'})[type]+'  '+msg;
  w.appendChild(d);setTimeout(()=>d.remove(),3200);
}

function openModal(title,html){
  let ov=document.getElementById('mov');
  if(!ov){ov=document.createElement('div');ov.id='mov';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px';ov.onclick=e=>{if(e.target===ov)closeModal();};document.body.appendChild(ov);}
  ov.innerHTML=`<div style="background:#0d1e2e;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:26px 22px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;font-family:'Manrope',sans-serif;color:#f0f6fc">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><span style="font-family:'Manrope',sans-serif;font-size:17px;font-weight:800">${title}</span><button onclick="closeModal()" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer">✕</button></div>${html}</div>`;
  ov.style.display='flex';
}
function closeModal(){const o=document.getElementById('mov');if(o)o.style.display='none';}

function tbl(heads,rows,empty='No data'){
  if(!rows.length)return`<div style="padding:28px;text-align:center;color:rgba(255,255,255,.2);font-size:13px">${empty}</div>`;
  return`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
    <thead><tr>${heads.map(h=>`<th style="padding:9px 11px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.35);text-align:left;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr style="border-bottom:1px solid rgba(255,255,255,.03)">${r.map(c=>`<td style="padding:9px 11px;font-size:13px;color:rgba(255,255,255,.72)">${c??'—'}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function sc(icon,val,lbl,sub,acc='#38bdf8'){
  return`<div style="background:var(--panel);border:1px solid var(--bdr);border-radius:13px;padding:16px 18px">
    <div style="font-size:18px;margin-bottom:7px">${icon}</div>
    <div style="font-size:24px;font-weight:800;font-family:'Manrope',sans-serif;color:${acc}">${val}</div>
    <div style="font-size:13px;font-weight:600;color:#f0f6fc;margin-top:2px">${lbl}</div>
    <div style="font-size:11px;color:rgba(255,255,255,.28);margin-top:1px">${sub}</div>
  </div>`;
}

function pnl(title,content,act=''){
  return`<div style="background:var(--panel);border:1px solid var(--bdr);border-radius:13px;padding:18px;margin-bottom:13px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px">
      <div style="font-family:'Manrope',sans-serif;font-size:15px;font-weight:800">${title}</div>
      ${act?`<div>${act}</div>`:''}
    </div>${content}</div>`;
}

// PAGES

let lastSec='';
const sbl=document.getElementById('sbl');
PAGES.forEach(p=>{
  if(p.sec!==lastSec){lastSec=p.sec;sbl.innerHTML+=`<div class="sb-sc">${p.sec}</div>`;}
  const unreadBadge=p.id==='msg'?`<span id="msg-badge" style="display:none;margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px">0</span>`:'';
  sbl.innerHTML+=`<div class="sl" id="sl-${p.id}" onclick="show('${p.id}')"><span class="sl-ic">${p.icon}</span><span>${p.lbl}</span>${unreadBadge}</div>`;
});

const ct=document.getElementById('ct');
PAGES.forEach(p=>{const d=document.createElement('div');d.className='pg';d.id='p-'+p.id;ct.appendChild(d);});

function show(id){
  document.querySelectorAll('.pg').forEach(p=>p.style.display='none');
  const el=document.getElementById('p-'+id);if(el)el.style.display='block';
  document.querySelectorAll('.sl').forEach(l=>{
    const on=l.id==='sl-'+id;
    l.classList.toggle('on',on);
  });
  document.getElementById('pgt').textContent=PAGES.find(p=>p.id===id)?.lbl||'';
}

// DATA
let D={orders:[],customers:[],payments:[],staff:[],inventory:[],sensors:[],sensorLogs:[],auditLogs:[],messages:[],prices:[],kb:[]};

async function init(){
  try{
    const[ord,cus,pay,sta,inv,sen,sl,al,msg,prc,kb]=await Promise.all([
      get('orders','',{select:'*,customers(name,phone)',order:'created_at.desc'}),
      get('customers','',{order:'name.asc'}),
      get('payments','',{select:'*',order:'paid_at.desc'}),
      get('staff','',{order:'created_at.asc'}),
      get('inventory','',{order:'name.asc'}),
      get('iot_sensors','',{order:'sensor_code.asc'}),
      get('sensor_logs','',{select:'*,iot_sensors(sensor_code)',order:'logged_at.desc',limit:'50'}),
      get('audit_logs','',{select:'*,staff(name)',order:'logged_at.desc',limit:'100'}),
      get('messages','',{select:'*,staff!messages_from_staff_id_fkey(name)',order:'sent_at.desc'}),
      get('prices','active=eq.true',{order:'service.asc'}),
      get('knowledge_base','',{select:'*,staff!knowledge_base_created_by_fkey(name)',order:'updated_at.desc'}),
    ]);
    D={orders:ord||[],customers:cus||[],payments:pay||[],staff:sta||[],inventory:inv||[],sensors:sen||[],sensorLogs:sl||[],auditLogs:al||[],messages:msg||[],prices:prc||[],kb:kb||[]};
    render();
  }catch(e){toast('Load error: '+e.message,'err');}
}

function render(){rOv();rOrd();rCus();rBil();rInv();rSta();rLoy();rMsg();rAnn();rKb();rIot();rAna();rNot();rAud();rPrc();renderAI();rBkp();updateMsgBadge();}
function updateMsgBadge(){const b=document.getElementById('msg-badge');if(!b)return;const c=D.messages.filter(m=>m.to_staff_id===me.id&&!m.read).length;b.textContent=c;b.style.display=c?'inline':'none';}

async function alog(action,detail){await post('audit_logs',{staff_id:me.id,action,detail});}

// ── OVERVIEW
function rOv(){
  const el=document.getElementById('p-ov');
  const rev=D.payments.reduce((s,p)=>s+(p.total_paid||0),0);
  const ready=D.orders.filter(o=>o.status==='Ready').length;
  const proc=D.orders.filter(o=>o.status==='Processing').length;
  const over=D.orders.filter(o=>o.status==='Overdue').length;
  const low=D.inventory.filter(i=>i.current_qty<=i.threshold).length;

  const resetReqs=D.auditLogs.filter(a=>a.action==='Password Reset Requested');
  const resetPanel = resetReqs.length ? tbl(['Time','Staff','Detail'], resetReqs.map(a=>[ftm(a.logged_at), a.staff?.name||'Staff', a.detail||'—'])) : '<div style="padding:24px;text-align:center;color:rgba(255,255,255,.35)">No password reset requests.</div>';
  el.innerHTML=`
  <div class="sg">
    ${sc('📋',D.orders.length,'Total Orders','all time','#38bdf8')}
    ${sc('✅',ready,'Ready','for collection','#10b981')}
    ${sc('⚙️',proc,'Processing','being cleaned','#f59e0b')}
    ${sc('💰',rnd(rev),'Revenue','all payments','#a78bfa')}
  </div>
  <div class="tc">
    ${pnl('📊 Order Status',tbl(['Status','Count','%'],
      ['Ready','Processing','Received','Collected','Overdue'].map(s=>{
        const c=D.orders.filter(o=>o.status===s).length;
        return[bdg(s),c,D.orders.length?Math.round(c/D.orders.length*100)+'%':'0%'];
      })
    ))}

  openModal('✏️ Adjust Points — '+name,`

function previewPts(current){
  const adj=parseInt(document.getElementById('pts-adj')?.value)||0;
  const newTotal=Math.max(0,current+adj);
  const tier=newTotal>=500?'🥇 Gold (15%)':newTotal>=300?'🥈 Silver (10%)':newTotal>0?'🥉 Bronze (5%)':'No tier';
  const el=document.getElementById('pts-preview');
  if(!el)return;
  el.style.display='block';
  el.innerHTML=`<strong style="color:#f0f6fc">${current}</strong> ${adj>=0?'+':''}${adj} = <strong style="color:#a78bfa;font-size:16px">${newTotal} pts</strong> → ${tier}`;
}

async function saveAwardPts(id, name, current){
  const adj=parseInt(document.getElementById('pts-adj')?.value)||0;

  await patch('customers','id=eq.'+id,{loyalty_pts:newTotal});
  await alog('Loyalty Points Adjusted',name+': '+current+' → '+newTotal+' ('+reason+')');

  closeModal();init();
}

async function sendMsg(){
  const body=document.getElementById('mbody')?.value.trim(),to=document.getElementById('mto')?.value||'';
  if(!body){toast('Enter message','err');return;}
  if(!to){
    const targets=D.staff.filter(s=>s.active && s.id!==me.id);
    if(!targets.length){toast('No staff available','err');return;}
    await Promise.all(targets.map(s=>post('messages',{from_staff_id:me.id,to_staff_id:s.id,body,read:false})));
  } else {
    await post('messages',{from_staff_id:me.id,to_staff_id:to,body,read:false});
  }
  await alog('Message Sent',body.slice(0,50));
  toast('Sent','ok');document.getElementById('mbody').value='';init();
}

    `<div class="fg"><label class="fl">Title</label><input class="fi" id="kb-title" value="${(item.title||'').replace(/"/g,'&quot;')}"></div>
    <div class="fg"><label class="fl">Content</label><textarea class="fi" id="kb-body" rows="8" style="width:100%;resize:none">${(item.body||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea></div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="saveKb('${id}')">Save Article</button>`
  );
}

async function saveKb(id=''){
  const title=(document.getElementById('kb-title')?.value||'').trim();
  const body=(document.getElementById('kb-body')?.value||'').trim();
  if(!title||!body){toast('Enter both title and content','err');return;}
  if(id){await patch('knowledge_base',`id=eq.${id}`,{title,body});}
  else{await post('knowledge_base',{title,body,created_by:me.id});}
  toast('Article saved','ok');
  closeModal();
  init();
}

// ── ANALYTICS — Power BI-style dashboard
function rAna(){
  const now = new Date();
  const todayStr = now.toLocaleDateString('en-ZA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  // ── READ ACTIVE FILTERS (persist across re-renders)
  const selSvc  = document.getElementById('ana-svc')?.value  || '';
  const selStat = document.getElementById('ana-stat')?.value || '';

  // FILTERED order set — everything derives from this
  const orders = D.orders.filter(o=>{
    if(selSvc  && o.service !== selSvc)  return false;
    if(selStat && o.status  !== selStat) return false;
    return true;
  });

  // KPI values
  const totalOrd  = orders.length;
  const collected = orders.filter(o=>o.status==='Collected').length;
  const ready     = orders.filter(o=>o.status==='Ready').length;
  const overdue   = orders.filter(o=>o.status==='Overdue').length;
  const rev       = D.payments.reduce((s,p)=>s+(p.total_paid||0),0);
  const closureRate = totalOrd ? Math.round(collected/totalOrd*100) : 0;
  const avgOrder  = collected ? Math.round(rev/collected) : 0;
  const lowStock  = D.inventory.filter(i=>i.current_qty<=i.threshold).length;

  // service breakdown
  const svcMap={};orders.forEach(o=>{svcMap[o.service]=(svcMap[o.service]||0)+1;});
  const svcEntries=Object.entries(svcMap).sort((a,b)=>b[1]-a[1]);
  const svcTotal=orders.length||1;

  // status breakdown
  const statuses=['Received','Processing','Ready','Collected','Overdue'];
  const statColors={'Received':'#38bdf8','Processing':'#f59e0b','Ready':'#10b981','Collected':'#a78bfa','Overdue':'#ef4444'};

  // payment method breakdown
  const methMap={};D.payments.forEach(p=>{methMap[p.method]=(methMap[p.method]||0)+1;});

  // loyalty tier breakdown
  const gold=D.customers.filter(c=>c.loyalty_pts>=500).length;
  const silver=D.customers.filter(c=>c.loyalty_pts>=300&&c.loyalty_pts<500).length;
  const bronze=D.customers.filter(c=>c.loyalty_pts>0&&c.loyalty_pts<300).length;
  const nopts=D.customers.filter(c=>!c.loyalty_pts).length;

  // orders by day (last 7 days)
  const days7=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days7.push({label:d.toLocaleDateString('en-ZA',{weekday:'short'}),date:d.toISOString().split('T')[0]});}
  const ordByDay=days7.map(d=>({label:d.label,count:orders.filter(o=>o.created_at&&o.created_at.startsWith(d.date)).length}));
  const maxDayOrd=Math.max(...ordByDay.map(d=>d.count),1);

  // staff performance
  const staffPerf=D.staff.map(s=>{
    const myOrd=orders.filter(o=>o.staff_id===s.id).length;
    const myPay=D.payments.filter(p=>p.staff_id===s.id).reduce((sum,p)=>sum+(p.total_paid||0),0);
    return{name:s.name,role:s.role,orders:myOrd,revenue:myPay};
  }).sort((a,b)=>b.orders-a.orders);

  // SVG sparkline helper
  function sparkline(data,color,w=80,h=28){
    if(!data.length||Math.max(...data)===0)return`<svg width="${w}" height="${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="${color}" stroke-width="1.5" opacity=".3"/></svg>`;
    const max=Math.max(...data,1);
    const pts=data.map((v,i)=>`${Math.round(i/(data.length-1||1)*w)},${Math.round(h-v/max*(h-4)-2)}`).join(' ');
    return`<svg width="${w}" height="${h}" style="overflow:visible"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>`;
  }

  // fake sparkline data based on real totals (last 6 periods)

  const spkClos=[55,60,62,65,closureRate-2,closureRate];

  function donut(segments,r=38,cx=45,cy=45){
    let total=segments.reduce((s,g)=>s+(g.v||0),0)||1;
    let angle=-90;
    const paths=segments.map(g=>{
      const pct=g.v/total;const deg=pct*360;
      const r1=angle*Math.PI/180,r2=(angle+deg)*Math.PI/180;
      const x1=cx+r*Math.cos(r1),y1=cy+r*Math.sin(r1);
      const x2=cx+r*Math.cos(r2),y2=cy+r*Math.sin(r2);
      const large=deg>180?1:0;
      const d=`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
      angle+=deg;
      return`<path d="${d}" fill="${g.c}" opacity=".9"/>`;
    }).join('');
    return`<svg width="90" height="90" viewBox="0 0 90 90">${paths}<circle cx="${cx}" cy="${cy}" r="${r*.58}" fill="#0a1628"/></svg>`;
  }

    }).join('');
    return`<svg width="${w}" height="${h}" style="overflow:visible">${bars}</svg>`;

// KPI card with sparkline
function kpiCard(label,val,sub,spkData,color,icon){
  const change=spkData&&spkData.length>=2?Math.round((spkData[spkData.length-1]-spkData[0])/(spkData[0]||1)*100):0;
  const up=change>=0;
  function sparkline(data,c,w=80,h=28){
    if(!data||!data.length||Math.max(...data)===0)return`<svg width="${w}" height="${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="${c}" stroke-width="1.5" opacity=".3"/></svg>`;
    const max=Math.max(...data,1);
    const pts=data.map((v,i)=>`${Math.round(i/(data.length-1||1)*w)},${Math.round(h-v/max*(h-4)-2)}`).join(' ');
    return`<svg width="${w}" height="${h}" style="overflow:visible"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>`;
  }
  return`<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:16px 18px;position:relative;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.35);margin-bottom:6px">${label}</div>
        <div style="font-size:26px;font-weight:900;color:${color};font-family:'Manrope',sans-serif;letter-spacing:-.5px;line-height:1">${val}</div>
        <div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:4px">${sub}</div>
      </div>
      <div style="font-size:24px;opacity:.15;position:absolute;top:12px;right:14px">${icon}</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px">
      <div style="font-size:11px;color:${up?'#10b981':'#ef4444'};font-weight:700">${up?'▲':'▼'} ${Math.abs(change)}% vs last</div>
      ${sparkline(spkData,color)}
    </div>
  </div>`;
}

function miniStat(icon,val,label,sub,color='#38bdf8'){

    <div style="width:38px;height:38px;border-radius:10px;background:${color}18;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${icon}</div>

}


// ── NOTIFICATIONS
// dismissed notification keys persist across renders
const _dismissedNots = new Set(JSON.parse(sessionStorage.getItem('not_dismissed')||'[]'));
function _saveNots(){sessionStorage.setItem('not_dismissed',JSON.stringify([..._dismissedNots]));}
function dismissNot(key){_dismissedNots.add(key);_saveNots();rNot();}
function dismissAllNots(){_allNotKeys.forEach(k=>_dismissedNots.add(k));_saveNots();rNot();}
let _allNotKeys=[];

function rNot(){
  const raw=[];
  D.orders.filter(o=>o.status==='Overdue').forEach(o=>raw.push({t:'err',i:'🔴',ti:'Overdue — '+(o.customers?.name||''),b:o.service,l:'ord',k:'ord-overdue-'+o.id}));
  D.inventory.filter(i=>i.current_qty<=i.threshold).forEach(i=>raw.push({t:'warn',i:'🟡',ti:'Low Stock — '+i.name,b:i.current_qty+' '+i.unit+' left',l:'inv',k:'inv-low-'+i.id}));
  D.orders.filter(o=>o.status==='Ready').forEach(o=>raw.push({t:'ok',i:'🟢',ti:'Ready — '+(o.customers?.name||''),b:o.service,l:'ord',k:'ord-ready-'+o.id}));

  D.auditLogs.filter(a=>a.action==='Password Reset Requested').forEach(a=>raw.push({t:'warn',i:'🔑',ti:'PIN Reset Request — '+(a.staff?.name||'Staff'),b:a.detail,l:'aud',k:'aud-reset-'+a.id}));
  D.messages.filter(m=>m.to_staff_id===null||m.to_staff_id===undefined).forEach(m=>raw.push({t:'info',i:'📣',ti:'Announcement — '+(m.staff?.name||'Staff'),b:m.body,l:'ann',k:'ann-'+m.id}));
  _allNotKeys=raw.map(n=>n.k);
  const notifs=raw.filter(n=>!_dismissedNots.has(n.k));
  const col={err:'rgba(239,68,68,.08)',warn:'rgba(245,158,11,.08)',ok:'rgba(16,185,129,.08)',info:'rgba(56,189,248,.08)'};
  const bdr={err:'rgba(239,68,68,.2)',warn:'rgba(245,158,11,.2)',ok:'rgba(16,185,129,.2)',info:'rgba(56,189,248,.2)'};
  document.getElementById('p-not').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px">
      <div style="font-weight:700">${notifs.length} notification${notifs.length!==1?'s':''} <span style="font-size:11px;color:var(--mut);font-weight:400">(${_dismissedNots.size} dismissed)</span></div>
      ${notifs.length?`<button class="btn bsm bgh" onclick="dismissAllNots()">Dismiss All</button>`:''}
    </div>`+
  (notifs.length?notifs.map(n=>`<div style="display:flex;gap:13px;padding:13px 15px;background:${col[n.t]};border:1px solid ${bdr[n.t]};border-radius:10px;margin-bottom:7px">
    <div style="font-size:18px">${n.i}</div>
    <div style="flex:1"><div style="font-size:13px;font-weight:700;margin-bottom:3px">${n.ti}</div>
    <div style="font-size:12px;color:rgba(255,255,255,.45);margin-bottom:7px">${n.b}</div>
    <div style="display:flex;gap:7px">
      <button class="btn bsm bgh" onclick="show('${n.l}');dismissNot('${n.k}')">View →</button>
      <button class="btn bsm bgh" style="color:rgba(255,255,255,.3)" onclick="dismissNot('${n.k}')">✕ Dismiss</button>
    </div></div></div>`).join('')
  :'<div style="padding:40px;text-align:center;color:rgba(255,255,255,.2)">✓ No notifications</div>');
}

// ── EXPORTS
function csvExp(table){
  const map={
    orders:{data:D.orders,f:['id','service','items','status','amount','discount','created_at']},
    customers:{data:D.customers,f:['id','name','phone','email','consent','loyalty_pts','joined_at']},
    inventory:{data:D.inventory,f:['name','unit','current_qty','max_qty','threshold']},
    audit_logs:{data:D.auditLogs,f:['logged_at','action','detail']},
    payments:{data:D.payments,f:['order_id','method','amount','discount_pct','total_paid','paid_at']},
  };
  const m=map[table];if(!m)return;
  const csv=[m.f.join(','),...m.data.map(r=>m.f.map(f=>`"${r[f]??''}"`).join(','))].join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='oasis-'+table+'-'+new Date().toISOString().split('T')[0]+'.csv';a.click();
}
function exportAll(){['orders','customers','inventory','audit_logs','payments'].forEach(t=>csvExp(t));}

function openAddSvc(){

    <div class="fg"><label class="fl">Price per item (R)</label><input class="fi" type="number" id="sv-price" placeholder="e.g. 95" min="0" step="0.01"></div>

}
async function saveNewSvc(){
  const name=(document.getElementById('sv-name')?.value||'').trim();
  const price=parseFloat(document.getElementById('sv-price')?.value)||0;
  if(!name){toast('Service name required','err');return;}
  if(price<=0){toast('Price must be greater than 0','err');return;}
  await post('prices',{service:name,price,active:true});
  await alog('Price Added',name+' — R'+price.toFixed(2));
  toast(name+' added at R'+price.toFixed(2),'ok');closeModal();init();
}

function openEditPrice(id,service,currentPrice){
  openModal('Edit Price — '+service,`
    <div class="fg"><label class="fl">New Price per item (R)</label>
      <input class="fi" type="number" id="ep-val" value="${currentPrice}" min="0" step="0.01"></div>
    <button class="btn" style="width:100%" onclick="saveEditPrice('${id}','${service}')">Save Price →</button>`);
}
async function saveEditPrice(id,service){
  const price=parseFloat(document.getElementById('ep-val')?.value);
  if(isNaN(price)||price<=0){toast('Enter a valid price','err');return;}
  await patch('prices','id=eq.'+id,{price,updated_at:new Date().toISOString()});
  await alog('Price Updated',service+' → R'+price.toFixed(2));
  toast(service+' updated to R'+price.toFixed(2),'ok');closeModal();init();
}

async function toggleSvc(id,service,active){
  await patch('prices','id=eq.'+id,{active:!active,updated_at:new Date().toISOString()});
  await alog(active?'Service Disabled':'Service Enabled',service);
  toast(service+' '+(active?'disabled':'enabled'),'ok');init();
}

async function runAI(){
  const box = document.getElementById('ai-out');
  const timeEl = document.getElementById('ai-time');
  if(!box) return;

  const cats = ['Orders','Customers','Revenue','Inventory','Loyalty'];
  const selected = cats.filter((_,i)=>document.getElementById('ai-c'+i)?.checked);
  if(!selected.length){ toast('Select at least one category','err'); return; }

  box.innerHTML = `<div style="text-align:center;padding:40px 0;color:rgba(255,255,255,.5)">

  </div>`;

  const totalRev = D.payments.reduce((s,p)=>s+(p.total_paid||0),0);
  const dayCount = {};
  D.orders.forEach(o=>{ const d=new Date(o.created_at).toLocaleDateString('en',{weekday:'long'}); dayCount[d]=(dayCount[d]||0)+1; });
  const sorted = Object.entries(dayCount).sort((a,b)=>b[1]-a[1]);
  const peakDay = sorted[0];
  const slowDay = sorted[sorted.length-1];
  const statusCount = {};
  D.orders.forEach(o=>{ statusCount[o.status]=(statusCount[o.status]||0)+1; });
  const lowStock = D.inventory.filter(i=>i.qty<=i.reorder_level).map(i=>i.name);

  const prompt = "You are a smart business analyst for a dry cleaning shop in South Africa.\nAnalyse this data and give 5-7 specific, actionable insights.\nFormat each as: [EMOJI] **Bold Title**: Explanation and recommendation.\nBe specific with numbers. Keep it practical for a small business owner.\n\n"+dataCtx;

  try {
    const t0 = Date.now();
    const res = await fetch('/api/ai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    const data = await res.json();
    if(!res.ok || data.error){
      box.innerHTML='<div style="color:#f87171">⚠️ '+( data.error||'Unknown error')+'</div>';return;
    }
    const text = data.text || 'No response received.';

    const html = text
      .replace(/\*\*(.*?)\*\*/g,'<strong style="color:#a5b4fc">$1</strong>')
      .split('\n').filter(l=>l.trim()).map(l=>`<div style="margin-bottom:10px">${l}</div>`).join('');
    box.innerHTML = html;

    box.innerHTML = '<div style="color:#f87171">Failed to get insights: '+e.message+'</div>';
  }
}
